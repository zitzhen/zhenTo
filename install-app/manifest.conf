#
# Declarative manifest of preinstalled apt sources and packages.
# Sourced by build.sh (install_apps), which registers sources, refreshes the
# index ONCE and installs everything in ONE apt-get install call.
# Per-app customisation that is not a plain apt install lives in *.sh files.

# APT_REPOS: third-party apt sources to register before the update.
# Each entry is passed to: add-apt-repository -y <entry>
# ZIT / patchsplit
#   App-URL: https://patchsplit.zitzhen.cn
#   OS-repository: https://github.com/zitzhen/patchsplit
APT_REPOS=(
    ppa:zitzhen/patchsplit
)

# APT_PACKAGES: installed via one "apt-get install -y --no-install-recommends".
# curl
#   App-URL: https://curl.se/
#   OS-repository: https://github.com/curl/curl
#   App-Maintainer: Oliver Lin <oliver@liuxiaozhen.dev>
#   Kept in the image: Installer.sh needs it to fetch the snap during build,
#   and it remains available to users in the installed system.
# patchsplit
#   App-Maintainer: Oliver Lin <oliver@liuxiaozhen.dev>
APT_PACKAGES=(
    curl
    patchsplit
)
