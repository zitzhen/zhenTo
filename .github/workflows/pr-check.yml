name: PR Check

# 合并前门禁：只做静态检查，不构建 ISO，几十秒出结果。
# 在仓库分支保护里把 lint / secrets 设为必需检查即可拦住问题提交。

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: v1.7.12
  SHFMT_VERSION: v3.14.1
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 安装 linter
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt

      - name: 语法检查
        run: |
          set -e
          while IFS= read -r f; do
            case "$(head -n1 "$f")" in
              *bash*) bash -n "$f" ;;
              *) sh -n "$f" ;;
            esac
          done < <(git ls-files '*.sh')

      - name: shellcheck
        run: |
          set -e
          mapfile -t files < <(git ls-files '*.sh')
          [ "${#files[@]}" -gt 0 ] || exit 0
          shellcheck --severity=warning --external-sources "${files[@]}"

      - name: shfmt（仅本次改动）
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${BASE_SHA}...HEAD" -- '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "本次 PR 未改动 shell 脚本"
            exit 0
          fi
          shfmt -d -i 4 "${files[@]}"

      - name: actionlint
        run: actionlint -color

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: gitleaks
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            "${GITLEAKS_IMAGE}" \
            dir /repo --no-banner --redact --verbose
