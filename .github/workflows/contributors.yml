name: Contributors

# After a PR is merged, rebuild CONTRIBUTORS from the Signed-off-by trailers in
# the whole history and open a PR with the update. Branch protection requires
# changes to main to go through a PR with a passing "signed-off-by" check.
#
# The PR is opened with a GitHub App installation token (not GITHUB_TOKEN), so
# its checks run immediately without the "approval-required" state. The commit
# is authored by the same App with a service Signed-off-by trailer.
#
# The PR is assigned to and reviewed by MAINTAINER. The workflow can also be
# started manually from the Actions tab; it then targets the default branch.
# pull_request_target keeps write permissions even for merged fork PRs. Only the
# base branch is checked out and executed, never the PR's working tree.

on:
  workflow_dispatch:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: contributors-${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
  cancel-in-progress: false

env:
  MAINTAINER: iamliuxiaozhen
  BOT_NAME: "zhento[bot]"
  BOT_EMAIL: "358577549+zhento-bot[bot]@users.noreply.github.com"
  BOT_SIGNOFF: "zhento[bot] <zhento-bot-noreply@zit.email>"

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
    steps:
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Rebuild CONTRIBUTORS from Signed-off-by
        id: rebuild
        run: bash .github/scripts/update-contributors.sh

      - name: Open a PR with the CONTRIBUTORS update
        id: open_pr
        if: steps.rebuild.outputs.changed == '1'
        env:
          SOURCE_PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          EXPECTED_INSTALL_ID: ${{ secrets.INSTALL_ID }}
          ACTUAL_INSTALL_ID: ${{ steps.app_token.outputs.installation-id }}
        run: |
          set -euo pipefail
          branch="contributors/${BASE_REF}"
          source="manual run"
          if [ -n "${SOURCE_PR:-}" ]; then
            source="PR #${SOURCE_PR}"
          fi

          if [ "$EXPECTED_INSTALL_ID" != "$ACTUAL_INSTALL_ID" ]; then
            echo "::error::GitHub App installation mismatch: expected ${EXPECTED_INSTALL_ID}, got ${ACTUAL_INSTALL_ID}"
            exit 1
          fi

          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git config commit.gpgsign false
          git add CONTRIBUTORS
          git commit \
            -m "chore: update CONTRIBUTORS from Signed-off-by" \
            -m "Rebuilt after ${source}." \
            -m "Signed-off-by: ${BOT_SIGNOFF}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${branch}"

          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base "$BASE_REF" \
            --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_REF" \
              --head "$branch" \
              --title "chore: update CONTRIBUTORS after ${source}" \
              --body "Rebuilt CONTRIBUTORS from Signed-off-by trailers after ${source}. Opened by the Contributors workflow." \
              --assignee "$MAINTAINER" \
              --reviewer "$MAINTAINER"
            number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base "$BASE_REF" \
              --state open --json number --jq '.[0].number // empty')"
          else
            echo "PR #${number} for ${branch} already exists; branch refreshed"
          fi
          printf 'number=%s\n' "$number" >>"$GITHUB_OUTPUT"

      - name: Label PRs
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          MERGED_PR: ${{ github.event.pull_request.number }}
          NEW_PR: ${{ steps.open_pr.outputs.number }}
        run: |
          set -e
          if ! gh api "repos/${GITHUB_REPOSITORY}/labels/CONTRIBUTORS" >/dev/null 2>&1; then
            gh api "repos/${GITHUB_REPOSITORY}/labels" \
              --field name=CONTRIBUTORS \
              --field color=5319e7 \
              --field description="Sign-off added or CONTRIBUTORS updated" >/dev/null
          fi
          for number in "$MERGED_PR" "$NEW_PR"; do
            [ -n "$number" ] || continue
            gh api "repos/${GITHUB_REPOSITORY}/issues/${number}/labels" \
              --method POST --field 'labels[]=CONTRIBUTORS' >/dev/null
          done
