name: Build ISO

# 触发方式：
#   - 手动触发（workflow_dispatch），指定版本号与基础 ISO
#   - 推送 v* 标签
#
# 产物：
#   - UEFI-only ISO，按 1800M 切分成压缩分卷（单文件远低于 GitHub 2G 限制）
#   - 自动创建 draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（不带 v，如 0.1.0）
        required: true
        default: "0.1.0"
      base_iso_url:
        description: 基础 ISO 下载地址
        required: true
        default: "https://releases.ubuntu.com/26.04/ubuntu-26.04.1-desktop-amd64.iso"
      base_iso_sha256:
        description: 基础 ISO 的 sha256（留空则跳过校验）
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_BASE_ISO_URL: https://releases.ubuntu.com/26.04/ubuntu-26.04.1-desktop-amd64.iso
  # 沿用原层的 128K 块，但改用 zstd：xz 重压 6.5G rootfs 在 CI 上太慢
  SQUASHFS_COMP: zstd
  SQUASHFS_BLOCK: "131072"
  VOLUME_SIZE: 1800m

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          preinstalled-runtimes: true
          swap-storage: false

      - name: 检查磁盘余量
        run: |
          set -e
          df -h
          avail_gb=$(df -Pk . | awk 'NR==2{print int($4/1024/1024)}')
          echo "可用空间：${avail_gb}G"
          if [ "$avail_gb" -lt 25 ]; then
            echo "XX 可用空间不足 25G，构建峰值约需 23G" >&2
            exit 1
          fi

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools rsync zip
          xorriso -version | head -n1

      - name: 计算版本
        id: meta
        run: |
          set -e
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            BASE_URL="${{ inputs.base_iso_url }}"
            BASE_SHA="${{ inputs.base_iso_sha256 }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            BASE_URL="${DEFAULT_BASE_ISO_URL}"
            BASE_SHA=""
          fi
          [ -n "$VERSION" ] || { echo "XX 版本号为空" >&2; exit 1; }
          {
            echo "version=${VERSION}"
            echo "tag=v${VERSION}"
            echo "base_url=${BASE_URL}"
            echo "base_sha=${BASE_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "版本：${VERSION}"

      - name: 下载基础 ISO
        env:
          URL: ${{ steps.meta.outputs.base_url }}
          SHA: ${{ steps.meta.outputs.base_sha }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/cache"
          BASE_ISO="$RUNNER_TEMP/cache/base.iso"
          curl -fL --retry 3 --retry-delay 5 -o "$BASE_ISO" "$URL"
          if [ -n "$SHA" ]; then
            echo "${SHA}  ${BASE_ISO}" | sha256sum -c -
          fi
          ls -lh "$BASE_ISO"
          echo "BASE_ISO=${BASE_ISO}" >> "$GITHUB_ENV"

      - name: 构建 ISO
        env:
          WORK_DIR: ${{ runner.temp }}/work
          OUT_DIR: ${{ runner.temp }}/out
        run: |
          sudo env \
            BASE_ISO="${BASE_ISO}" \
            VERSION="${{ steps.meta.outputs.version }}" \
            WORK_DIR="${WORK_DIR}" \
            OUT_DIR="${OUT_DIR}" \
            SQUASHFS_COMP="${SQUASHFS_COMP}" \
            SQUASHFS_BLOCK="${SQUASHFS_BLOCK}" \
            ./build.sh

      - name: 分卷压缩
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -e
          ISO_NAME="zhenTo-${VERSION}-amd64.iso"
          mkdir -p dist
          cp "${RUNNER_TEMP}/out/${ISO_NAME}" dist/
          cp "${RUNNER_TEMP}/out/zhenTo-${VERSION}-amd64.md5" dist/

          # 基础 ISO 已无用，先腾出 6G 空间再切分卷
          rm -f "${BASE_ISO}"

          (
            cd dist
            sha256sum "${ISO_NAME}" > "${ISO_NAME}.sha256"
            # 每个分卷 1800M（1.76GiB），远低于 GitHub Release 单文件 2G 上限
            zip -0 -s "${VOLUME_SIZE}" "${ISO_NAME}.zip" "${ISO_NAME}"
            rm -f "${ISO_NAME}"
            sha256sum "${ISO_NAME}".z* "${ISO_NAME}.zip" > SHA256SUMS
          )

          ls -lh dist

      - name: 创建草稿 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ZhenTo ${{ steps.meta.outputs.version }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            ZhenTo ${{ steps.meta.outputs.version }}（UEFI-only，基于 Ubuntu 26.04.1 LTS）

            ## 文件说明

            - `zhenTo-${{ steps.meta.outputs.version }}-amd64.iso.zip` / `.z01` / `.z02` ...：压缩分卷，每个小于 2G
            - `zhenTo-${{ steps.meta.outputs.version }}-amd64.iso.sha256`：完整 ISO 的 sha256
            - `zhenTo-${{ steps.meta.outputs.version }}-amd64.md5`：完整 ISO 的 md5
            - `SHA256SUMS`：各分卷的 sha256

            ## 还原 ISO

            把全部分卷下载到同一目录后执行：

            ```bash
            unzip zhenTo-${{ steps.meta.outputs.version }}-amd64.iso.zip
            sha256sum -c zhenTo-${{ steps.meta.outputs.version }}-amd64.iso.sha256
            ```

            ## 写入 U 盘

            ```bash
            sudo dd if=zhenTo-${{ steps.meta.outputs.version }}-amd64.iso of=/dev/sdX bs=4M status=progress oflag=sync
            ```

            仅支持 UEFI 启动。

            > 本 Release 由 GitHub Actions 自动生成的草稿，确认无误后再发布。
