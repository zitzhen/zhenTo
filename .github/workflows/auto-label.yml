name: Auto Label

# Label every PR and issue on open / reopen / title edit (and every PR push).
# Labels are defined in .github/scripts/auto-label.js and created on demand.
#
# Security: pull_request_target runs in the BASE branch context, so the script
# that executes is the reviewed one from the default branch, never PR code.
# The PR working tree is intentionally NOT checked out or executed.

on:
  # Manual run labels all existing open PRs / issues once (backfill).
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  issues:
    types: [opened, reopened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: auto-label-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Apply labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node .github/scripts/auto-label.js --backfill
          else
            node .github/scripts/auto-label.js
          fi
